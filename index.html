<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Colourful Home! 🍊</title><style>
:root{font-family:ui-rounded,system-ui,-apple-system,'Arial Rounded MT Bold',sans-serif;color:#30263b;background:#fff1f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#ffe0ef,transparent 40%),#fff4f9}.wrap{max-width:690px;margin:auto;padding:18px 16px 45px}.top{text-align:center}.eyebrow{font-size:13px;font-weight:800;letter-spacing:2px;color:#c44787}h1{font-size:clamp(29px,7vw,45px);margin:7px 0;color:#d82480}p{margin:5px 0 14px;color:#766b7d}.progress{display:flex;justify-content:space-between;font-weight:800;margin:18px 2px 8px}.bar{height:12px;border-radius:20px;background:#f6d5e6;overflow:hidden}.fill{height:100%;background:#e52c88;width:0;transition:width .35s}.card{background:white;border:5px solid #f6c6df;border-radius:27px;margin-top:20px;padding:18px 15px 21px;box-shadow:0 12px 30px #a43b7120;transition:border-color .2s}.card.good{border-color:#36b77b}.card.bad{border-color:#ef4f67}.instruction{text-align:center;font-weight:700;font-size:14px;color:#86758a}.phrase{text-align:center;font-size:clamp(26px,6vw,36px);font-weight:900;margin:7px 0 8px}.art{height:245px;max-width:430px;margin:auto;display:flex;justify-content:center;align-items:center;touch-action:manipulation}.art svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 1px #ddd4db)}.paint{fill:#fff;stroke:#34303d;stroke-width:5;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;transition:fill .16s}.detail{fill:none;stroke:#34303d;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}.message{text-align:center;min-height:31px;font-weight:900;font-size:18px;margin-top:5px}.message.ok{color:#219a61}.message.err{color:#d93955}.tools{margin-top:20px;background:#fff;border:2px solid #f5d4e5;border-radius:24px;padding:15px}.tools h2{font-size:17px;margin:0 0 13px;text-align:center}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.swatch{background:#fff;border:2px solid #eee0e9;border-radius:15px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:12px;color:#54485a;cursor:pointer}.swatch.selected{border-color:#db2780;box-shadow:0 0 0 3px #f9c7df}.dot{width:34px;height:34px;border-radius:50%;border:2px solid #514b52}.eraser{margin-top:12px;width:100%;border:2px solid #eee0e9;background:#fff;border-radius:14px;padding:12px;font-size:16px;font-weight:800;color:#4d4053}.eraser.selected{border-color:#d82480;background:#fff0f7}.hint{text-align:center;font-size:13px;color:#897c8e;margin-top:11px}.bottom{display:flex;gap:10px;margin-top:15px}.secondary{border:2px solid #e7b9d2;background:#fff;color:#a52968;padding:13px 15px;border-radius:14px;font-weight:800;flex:1}.primary{border:0;background:#e32986;color:white;padding:14px 17px;border-radius:14px;font-weight:900;flex:1}.end{text-align:center;padding:25px 12px}.end .cup{font-size:60px}.end h2{font-size:31px;color:#d82480}.hidden{display:none}button{font-family:inherit}button:focus-visible{outline:3px solid #d82480;outline-offset:3px}
</style></head><body><main class="wrap"><div class="top"><div class="eyebrow">🍊 SPOTLIGHT 2 · MY HOME</div><h1>My Colourful Home!</h1><p>Прочитай, выбери кисточку и раскрась предмет!</p></div><div id="game"><div class="progress"><span id="count">Карточка 1 из 12</span><span id="score">⭐ 0</span></div><div class="bar"><div class="fill" id="fill"></div></div><section class="card" id="card"><div class="instruction">Read and colour!</div><div class="phrase" id="phrase"></div><div class="art" id="art"></div><div class="message" id="message" aria-live="polite"></div></section><section class="tools"><h2>🎨 Выбери цвет кисточки</h2><div class="palette" id="palette"></div><button class="eraser" id="eraser">⌫ Ластик</button><div class="hint">Сначала выбери цвет, затем нажми на рисунок</div></section><div class="bottom"><button class="secondary" id="restart">↻ Начать заново</button><button class="secondary" id="sound">🔊 Прочитать фразу</button></div></div><section class="card end hidden" id="end"><div class="cup">🏆</div><h2>Well done!</h2><p>Ты раскрасил все предметы!</p><h2 id="final"></h2><p id="mistakes"></p><button class="primary" id="again">Играть ещё раз 🍊</button></section></main><script>
const colors=[['red','#ed343b'],['yellow','#ffd62e'],['green','#30b35c'],['blue','#338ce9'],['white','#ffffff'],['brown','#a65c30'],['black','#27232c'],['purple','#a548d4']];
const tasks=[['radio','red'],['bed','purple'],['chair','green'],['table','yellow'],['tree house','brown'],['radio','blue'],['bed','white'],['chair','red'],['table','black'],['tree house','green'],['radio','purple'],['bed','yellow']];
const svg={
'radio':`<rect class="paint" x="78" y="92" width="244" height="135" rx="18"/><path class="detail" d="M112 90 L270 46 M260 43 L286 43 M111 120 H292"/><circle class="detail" cx="160" cy="177" r="37"/><circle class="detail" cx="160" cy="177" r="24"/><circle class="detail" cx="265" cy="158" r="12"/><circle class="detail" cx="265" cy="198" r="12"/><path class="detail" d="M125 90 V76 Q125 64 138 64 H196 Q208 64 208 76 V90"/>`,
'bed':`<path class="paint" d="M74 154 L300 154 L332 184 L332 224 L298 224 L298 211 L93 211 L93 227 L69 227 L69 161 Z"/><path class="detail" d="M74 154 L74 104 Q74 81 100 81 H283 Q304 81 304 106 V154 M92 151 Q92 120 123 120 H167 Q186 120 188 151 M199 151 Q199 120 231 120 H269 Q286 120 287 151 M95 184 H308"/>`,
'chair':`<path class="paint" d="M126 72 Q126 60 140 60 H249 Q264 60 264 75 L251 176 L139 176 Z"/><path class="paint" d="M113 168 L277 168 L292 192 L100 192 Z"/><path class="paint" d="M112 192 L134 192 L134 254 L113 254 Z"/><path class="paint" d="M260 192 L282 192 L282 254 L260 254 Z"/><path class="detail" d="M159 76 L159 162 M195 76 L195 162 M232 76 L232 162"/>`,
'table':`<path class="paint" d="M67 124 L294 124 L335 157 L103 157 Z"/><path class="paint" d="M103 157 L127 157 L127 250 L103 250 Z"/><path class="paint" d="M281 157 L304 155 L304 247 L281 247 Z"/><path class="paint" d="M75 132 L94 132 L94 237 L75 237 Z"/><path class="detail" d="M103 174 L304 174"/>`,
 'tree house':`<path class="paint" d="M185 141 L220 141 L220 257 L184 257 Z"/><path class="paint" d="M94 132 Q62 121 87 90 Q72 60 107 50 Q119 15 159 36 Q186 9 218 36 Q259 13 282 52 Q320 57 307 92 Q335 128 291 142 Z"/><path class="paint" d="M137 126 L200 72 L267 126 L267 207 L137 207 Z"/><path class="detail" d="M124 129 L200 61 L280 129 M178 207 V156 H219 V207 M237 147 H258 V174 H237 Z M220 257 L270 214 M220 235 L255 235 M220 251 L239 251"/>`
};
let idx=0,selected=null,tries=0,errors=0,locked=false,timer=null;const $=id=>document.getElementById(id);
function paintSelect(c){selected=c;document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color===c));$('eraser').classList.toggle('selected',c==='erase');}
function setup(){clearTimeout(timer);locked=false;selected=null;$('game').classList.remove('hidden');$('end').classList.add('hidden');$('card').className='card';$('message').textContent='';$('message').className='message';$('phrase').textContent='a '+tasks[idx][1]+' '+tasks[idx][0];$('count').textContent=`Карточка ${idx+1} из ${tasks.length}`;$('score').textContent=`⭐ ${idx}`;$('fill').style.width=(idx/tasks.length*100)+'%';$('art').innerHTML=`<svg viewBox="0 0 400 280" role="img" aria-label="Раскрась предмет: ${tasks[idx][0]}">${svg[tasks[idx][0]]}</svg>`;document.querySelectorAll('.paint').forEach(el=>el.addEventListener('click',()=>apply(el)));paintSelect(null)}
function apply(el){if(locked||!selected)return;if(selected==='erase'){document.querySelectorAll('.paint').forEach(p=>p.style.fill='#fff');$('card').className='card';$('message').textContent='';return}const correct=selected===tasks[idx][1];document.querySelectorAll('.paint').forEach(p=>p.style.fill=colors.find(c=>c[0]===selected)[1]);$('card').className='card '+(correct?'good':'bad');$('message').className='message '+(correct?'ok':'err');$('message').textContent=correct?'✓ Great job!':'✕ Try again! Выбери другой цвет.';if(correct){locked=true;timer=setTimeout(()=>{idx++;if(idx>=tasks.length)finish();else setup()},1150)}else{errors++}}
function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('final').textContent=`${tasks.length} / ${tasks.length} ⭐`;$('mistakes').textContent=errors===0?'Без ошибок! Fantastic!':`Попыток с ошибкой: ${errors}. Ты справился!`}
colors.forEach(([name,hex])=>{const b=document.createElement('button');b.className='swatch';b.dataset.color=name;b.innerHTML=`<span class="dot" style="background:${hex}"></span><span>${name}</span>`;b.addEventListener('click',()=>paintSelect(name));$('palette').append(b)});$('eraser').onclick=()=>paintSelect('erase');$('restart').onclick=()=>{idx=0;errors=0;setup()};$('again').onclick=$('restart').onclick;$('sound').onclick=()=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($('phrase').textContent);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)};setup();
</script></body></html>
